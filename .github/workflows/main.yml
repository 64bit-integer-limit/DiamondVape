name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Sets up the environment and safely handles caching for dependencies
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # MAGIC FIX STEP: Forces Linux to treat gradlew as an executable program
    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew

    # Executes the local Gradle Wrapper build script natively
    - name: Build Mod
      run: ./gradlew build

    # Saves the compiled mod so you can download it from your GitHub Actions page
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fabric-Mod-JAR
        path: build/libs/*.jar
